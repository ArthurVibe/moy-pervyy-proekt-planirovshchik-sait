<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="What’s Up, Bro? Your personal AI planner. Less Planning. More Living.">
  <link rel="preload" href="assets/fonts/PlayfairDisplay-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <title>What’s Up, Bro? — The Private Club</title>
  <style>
    /* Stage 1: static composition only. No animations or transitions. */
    @font-face {
      font-family: 'Playfair Display';
      src: url('assets/fonts/PlayfairDisplay-Variable.ttf') format('truetype');
      font-style: normal;
      font-weight: 400 900;
      font-display: swap;
    }
    :root {
      --forest: #14221b;
      --brass: #b99a69;
      --ivory: #e9dfcd;
      --burgundy: #512b35;
      --warm-text: #ddd0b9;
      --display: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --ui: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      --page-gutter: clamp(24px, 5.5vw, 144px);
      --header-height: 112px;
      --control-radius: 6px;
      --scene-position: 40% 0%;
      --control-height: 50px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--forest); }
    body { margin: 0; color: var(--ivory); font: 16px/1.5 var(--ui); }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    button, a { touch-action: manipulation; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--ivory);
      outline-offset: 5px;
    }
    button::-moz-focus-inner { border: 0; }
    [hidden] { display: none !important; }
    h1, p { margin: 0; }
    ::selection { color: var(--forest); background: var(--brass); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .skip-link { position: fixed; top: 12px; left: 12px; z-index: 30; padding: 12px 20px; background: var(--ivory); color: var(--forest); }
    .skip-link:not(:focus) { width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); }
    .site-shell { position: relative; isolation: isolate; background: var(--forest); }

    /* Header floats over the same continuous scene as the Hero. */
    .site-header {
      position: absolute; inset: 0 0 auto; z-index: 10;
      background: linear-gradient(180deg, rgb(20 34 27 / .79), rgb(20 34 27 / .35) 75%, transparent);
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 36px; min-height: var(--header-height); padding: 12px var(--page-gutter);
    }
    .brand { display: inline-flex; flex: 0 0 auto; flex-direction: column; align-items: flex-start; gap: 9px; }
    .wordmark { display: grid; gap: 3px; font-family: var(--display); font-weight: 700; line-height: .85; }
    .wordmark-top { display: block; font-size: 22.5px; letter-spacing: -.035em; }
    .wordmark-bottom { display: block; font-size: 49px; letter-spacing: -.055em; }
    .brand-tagline { font-size: 11px; line-height: 1.3; letter-spacing: .11em; color: var(--warm-text); white-space: nowrap; }
    .header-controls { display: flex; flex: 1; justify-content: space-between; align-items: center; gap: clamp(28px, 3.5vw, 90px); }
    .main-nav { display: flex; margin-inline: auto; align-items: center; gap: clamp(24px, 2.6vw, 64px); }
    .nav-action { padding: 12px 0; min-height: 44px; border: 0; background: transparent; color: var(--ivory); font-size: 13px; white-space: nowrap; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 22px;
      min-height: var(--control-height); padding: 13px 24px;
      border: 1px solid var(--brass); border-radius: var(--control-radius);
      color: var(--forest); background: var(--brass);
      font-size: 13px; line-height: 1.5; font-weight: 600; white-space: nowrap;
    }
    .invitation { font-size: 12px; padding-inline: 20px; gap: 20px; }
    .button-outline { color: var(--ivory); background: rgb(20 34 27 / .42); font-weight: 500; }
    .arrow { display: block; width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .menu-toggle { display: none; align-items: center; justify-content: center; gap: 10px; min-width: 48px; min-height: 48px; padding: 10px 14px; background: rgb(20 34 27 / .55); border: 1px solid var(--brass); border-radius: var(--control-radius); color: var(--ivory); font-size: 12px; }
    .menu-symbol { width: 20px; height: 16px; display: grid; align-content: space-between; }
    .menu-symbol span { display: block; width: 100%; height: 1px; background: currentColor; }
    .menu-toggle[aria-expanded="true"] .menu-symbol { display: none; }

    /* Preserve the original image; only its responsive display is cropped. */
    .hero {
      display: flex; flex-direction: column; justify-content: center; position: relative;
      min-height: 100vh; min-height: 100svh; isolation: isolate;
      padding: calc(var(--header-height) + 76px) var(--page-gutter) 76px;
      overflow: hidden;
    }
    .hero-scene { position: absolute; inset: 0; z-index: -2; margin: 0; }
    .hero-scene picture { display: block; width: 100%; height: 100%; }
    .hero-photo { display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--scene-position); }
    .hero::before {
      content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(90deg, rgb(20 34 27 / .38), rgb(20 34 27 / .12) 38%, transparent 57%);
    }
    .hero-content { width: min(49%, 800px); }
    .hero-title {
      font: 400 clamp(44px, 4.5vw, 76px)/1.07 var(--display);
      letter-spacing: -.035em; color: var(--ivory);
    }
    .hero-title span { display: block; }
    .hero-tagline { margin-top: 18px; font: 400 clamp(23px, 1.85vw, 30px)/1.4 var(--display); color: var(--brass); }
    .hero-description { max-width: 46ch; margin-top: 16px; color: var(--warm-text); font-size: 16px; line-height: 1.65; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 24px; }
    .hero-actions .button { min-width: 170px; }
    .notice {
      position: fixed; z-index: 20; right: var(--page-gutter); bottom: 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 28px;
      min-width: 240px; max-width: calc(100% - 48px); padding: 12px 12px 12px 20px;
      color: var(--ivory); background: var(--forest); border: 1px solid var(--brass);
      border-radius: var(--control-radius); box-shadow: 0 12px 32px rgb(0 0 0 / .22);
      font-size: 14px;
    }
    .notice-close { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: var(--ivory); font-size: 24px; }
    @media (min-width: 1101px) and (max-height: 650px) {
      .hero { min-height: 650px; padding-bottom: 60px; }
    }

    /* A disclosure menu avoids empty sections and stays usable on touch screens. */
    @media (max-width: 1100px) {
      :root { --page-gutter: 32px; --header-height: 104px; --scene-position: 68% 0%; }
      .header-inner { gap: 24px; }
      .menu-toggle { display: inline-flex; }
      .header-controls {
        position: absolute; top: calc(100% - 1px); left: var(--page-gutter); right: var(--page-gutter);
        display: none; align-items: stretch; gap: 24px; flex-direction: column;
        padding: 24px; border: 1px solid var(--brass); border-radius: var(--control-radius);
        background: var(--forest);
      }
      .header-controls.is-open { display: flex; }
      .main-nav { margin-inline: 0; align-items: stretch; gap: 8px; flex-direction: column; }
      .nav-action { text-align: left; }
      .invitation { align-self: flex-start; }
      .hero-content { width: 53%; }
      .hero-title { font-size: clamp(40px, 5vw, 55px); }
      .hero-actions { gap: 12px; }
    }
    @media (max-width: 767px) {
      :root { --page-gutter: 24px; --header-height: 104px; }
      .site-header { background: var(--forest); }
      .brand-tagline { font-size: 11px; letter-spacing: .085em; }
      .wordmark-top { font-size: 19.3px; }
      .wordmark-bottom { font-size: 42px; }
      .brand { gap: 8px; }
      .hero { min-height: 100vh; min-height: 100svh; padding: var(--header-height) 0 0; justify-content: flex-start; overflow: visible; }
      .hero::before { display: none; }
      .hero-content { order: 0; width: 100%; margin-top: 0; padding: 48px var(--page-gutter) 40px; }
      .hero-title { font-size: clamp(38px, 9.8vw, 54px); line-height: 1.08; }
      .hero-tagline { margin-top: 18px; font-size: 23px; }
      .hero-actions { margin-top: 22px; gap: 12px; }
      .hero-actions .button { min-width: 0; flex: 1 1 145px; padding-inline: 16px; gap: 12px; }
      .hero-scene { position: relative; inset: auto; order: 1; width: 100%; aspect-ratio: 1 / 1; z-index: 0; overflow: hidden; }
      .hero-photo { object-position: 78% 50%; }
      .notice { right: 16px; bottom: 16px; max-width: calc(100% - 32px); }
    }
    @media (max-width: 359px) {
      :root { --page-gutter: 20px; }
      .hero-title { font-size: 34px; }
      .hero-actions { flex-direction: column; }
      .hero-actions .button { flex: 0 0 auto; }
      .menu-label { display: none; }
    }
    /* Deliberately no animation, transition, reflection or Warm Welcome layer. */
  </style>
</head>
<body>
  <a class="skip-link" href="#hero-title">Skip to content</a>
  <div class="site-shell" id="top">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#top" aria-label="What’s Up, Bro? — Back to top">
          <span class="wordmark" aria-hidden="true"><span class="wordmark-top">WHAT’S UP,</span><span class="wordmark-bottom">BRO?</span></span>
          <span class="brand-tagline">YOUR PERSONAL AI PLANNER</span>
        </a>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="header-controls" aria-label="Open menu">
          <span class="menu-symbol" aria-hidden="true"><span></span><span></span><span></span></span><span class="menu-label">Menu</span>
        </button>
        <div class="header-controls" id="header-controls">
          <nav class="main-nav" aria-label="Main navigation">
            <button class="nav-action" type="button" data-coming-soon>About Bro</button>
            <button class="nav-action" type="button" data-coming-soon>How It Works</button>
            <button class="nav-action" type="button" data-coming-soon>Features</button>
          </nav>
          <button class="button invitation" type="button" data-coming-soon>Get Early Access <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
        </div>
      </div>
    </header>
    <main class="hero" id="hero" aria-labelledby="hero-title">
      <figure class="hero-scene"><picture><source type="image/webp" srcset="assets/Whats_Up_Bro_Private_Club_Hero_2560x1440.webp"><img class="hero-photo" id="club-photo" src="assets/Whats_Up_Bro_Private_Club_Hero_2560x1440.png" width="2560" height="1440" alt="Bro Gentleman in a green hoodie and graphite jacket beside a burgundy Chesterfield sofa in a warmly lit private club." fetchpriority="high" decoding="async"></picture></figure>
      <div class="hero-content">
        <h1 class="hero-title" id="hero-title" tabindex="-1"><span>PLAN LIKE</span><span>A GENTLEMAN.</span></h1>
        <p class="hero-tagline">Less Planning. More Living.</p>
        <p class="hero-description">Your personal AI planner for tasks, plans, and the things you don't want to forget. Just tell Bro.</p>
        <div class="hero-actions">
          <button class="button" type="button" data-coming-soon>Meet Bro <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M7 6h11v11"/></svg></button>
          <button class="button button-outline" type="button" data-coming-soon>How It Works <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
        </div>
      </div>
    </main>
  </div>
  <aside class="notice" id="coming-soon" aria-label="Preview notice" hidden>
    <p id="notice-message" role="status" aria-live="polite"></p>
    <button class="notice-close" id="notice-close" type="button" aria-label="Close notice">×</button>
  </aside>
  <script>
    'use strict';
    // Only prototype behaviour: no animations, registration, storage or requests.
    (() => {
      const toggle = document.getElementById('menu-toggle');
      const controls = document.getElementById('header-controls');
      const mobile = window.matchMedia('(max-width: 1100px)');
      const notice = document.getElementById('coming-soon');
      let noticeTrigger = null;
      const closeMenu = (restoreFocus = false) => {
        controls.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Open menu');
        if (restoreFocus) toggle.focus();
      };
      const closeNotice = (restoreFocus = false) => {
        notice.hidden = true;
        document.getElementById('notice-message').textContent = '';
        if (restoreFocus && noticeTrigger?.isConnected) noticeTrigger.focus();
      };
      toggle.addEventListener('click', () => {
        const open = toggle.getAttribute('aria-expanded') !== 'true';
        controls.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
      document.querySelectorAll('[data-coming-soon]').forEach((button) => {
        button.addEventListener('click', () => {
          const fromMenu = mobile.matches && controls.contains(button);
          if (fromMenu) closeMenu(true);
          noticeTrigger = fromMenu ? toggle : button;
          notice.hidden = false;
          document.getElementById('notice-message').textContent = 'Coming soon';
        });
      });
      document.getElementById('notice-close').addEventListener('click', () => closeNotice(true));
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        if (toggle.getAttribute('aria-expanded') === 'true') closeMenu(true);
        else if (!notice.hidden) closeNotice(notice.contains(document.activeElement));
      });
      document.addEventListener('pointerdown', (event) => {
        if (!controls.contains(event.target) && !toggle.contains(event.target)) closeMenu();
      });
      mobile.addEventListener('change', () => {
        const focusInMenu = controls.contains(document.activeElement);
        closeMenu(mobile.matches && focusInMenu);
        if (!mobile.matches && document.activeElement === toggle) controls.querySelector('button').focus();
      });
      document.querySelector('.brand').addEventListener('click', () => closeMenu());
      // A missing source is recorded for QA; never replace the approved photograph.
      const photo = document.getElementById('club-photo');
      const photoUnavailable = () => {
        document.documentElement.dataset.heroAsset = 'missing';
        photo.hidden = true;
      };
      photo.addEventListener('error', photoUnavailable);
      if (photo.complete && !photo.naturalWidth) photoUnavailable();
    })();
  </script>
</body>
</html>
